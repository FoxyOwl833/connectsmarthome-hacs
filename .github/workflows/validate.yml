name: Validate integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pytest ruff probatio requests cryptography tuya-device-sharing-sdk==0.2.15
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q custom_components
      - run: pytest tests/unit -q

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Latest published test harness pins Home Assistant 2026.10.2.
      # The integration baseline is 2026.10.3; both share the config-flow API.
      - run: python -m pip install pytest-homeassistant-custom-component==0.13.373 tuya-device-sharing-sdk==0.2.15 tuya-device-handlers==0.0.31
      - run: pytest tests/ha -q --asyncio-mode=auto

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
